version: "3.9"
services:
  rumbledb:
    image: rumbledb/rumble:latest
    command: ["--shell"]
    volumes:
      - ./data:/data:ro
    ports:
      - "8001:8001"

  spark-master:
    image: bitnami/spark:3.5
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLE=no
      - SPARK_RPC_ENCRYPTION_ENABLE=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLE=no
      - SPARK_SSL_ENABLE=no
    ports:
      - "7077:7077"   # Spark master
      - "8080:8080"   # Master UI

  spark-worker:
    image: bitnami/spark:3.5
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    depends_on:
      - spark-master
    ports:
      - "8081:8081"   # Worker UI

